services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
        '--requirepass',
        '${LUMA_DB_PASSWORD:?Run pnpm run setup first}',
      ]
    environment:
      LUMA_VALKEY_PASSWORD: ${LUMA_DB_PASSWORD:?Run pnpm run setup first}
    ports:
      - '127.0.0.1::6379'
    volumes:
      - valkey:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'valkey-cli --no-auth-warning -a "$$LUMA_VALKEY_PASSWORD" ping',
        ]
      interval: 1s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'track_io_timing=on',
      ]
    environment:
      POSTGRES_DB: luma
      POSTGRES_PASSWORD: ${LUMA_DB_PASSWORD:?Run pnpm run setup first}
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d luma']
      interval: 1s
      timeout: 5s
      retries: 60
  temporal:
    image: temporalio/temporal:1.6.1
    profiles: [workflows]
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/home/temporal/temporal.db',
      ]
    ports:
      - '127.0.0.1::7233'
      - '127.0.0.1::8233'
    volumes:
      - temporal:/home/temporal
    healthcheck:
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'cluster',
          'health',
          '--address',
          '127.0.0.1:7233',
        ]
      interval: 2s
      timeout: 5s
      retries: 60
  grafana:
    image: grafana/otel-lgtm@sha256:d6c52678ab5b7144f27ae569fd778608121c0f4a10eb411983750a0d67c1fbe3
    profiles: [observability]
    ports:
      - '127.0.0.1::3000'
      - '127.0.0.1::4318'
      - '127.0.0.1::4040'
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      PYROSCOPE_EXTRA_ARGS: '-usage-stats.enabled=false'
      TEMPO_EXTRA_ARGS: '-reporting.enabled=false'
      LOKI_EXTRA_ARGS: '-reporting.enabled=false'
    volumes:
      - observability:/data
      - ./tooling/observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/luma.yaml:ro
      - ./tooling/observability/dashboard.json:/otel-lgtm/dashboards/luma.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:13133/ready && curl -fsS http://localhost:4040/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 60
    stop_grace_period: 20s

volumes:
  valkey:
  postgres:
  temporal:
  observability:
