services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_PASSWORD: ${LUMA_DB_PASSWORD:?Run pnpm run setup first}
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d luma']
      interval: 1s
      timeout: 5s
      retries: 60
  temporal:
    image: temporalio/temporal:1.6.1
    profiles: [workflows]
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/home/temporal/temporal.db',
      ]
    ports:
      - '127.0.0.1::7233'
      - '127.0.0.1::8233'
    volumes:
      - temporal:/home/temporal
    healthcheck:
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'cluster',
          'health',
          '--address',
          '127.0.0.1:7233',
        ]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  postgres:
  temporal:
