[tools]
node = "24.22.0"
pnpm = "12.14.0"

[tasks.setup]
description = "Install dependencies and prepare the local database and demo workspace"
run = "pnpm run setup"

[tasks.dev]
description = "Start the API and web app"
run = "pnpm dev"

[tasks.simulator]
description = "Start the commerce simulator with Luma connected to it"
run = "pnpm simulator"

[tasks.check]
description = "Run all checks with a disposable test database"
run = "pnpm test:full"
