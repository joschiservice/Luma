packages:
  - apps/*
  - packages/*
  - packages/connectors/*
  - packages/simulator/*

minimumReleaseAge: 0
saveExact: true
strictPeerDependencies: true

allowBuilds:
  '@swc/core': false
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false

# ts-rest's stable adapter still declares Fastify 4; API integration tests cover 5.
peerDependencyRules:
  allowedVersions:
    '@ts-rest/fastify@3.52.1>fastify': '5.12.5'
