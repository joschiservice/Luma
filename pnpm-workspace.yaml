packages:
  - apps/*
  - packages/*
  - packages/apps/*
  - packages/connectors/*
  - packages/simulator/*
  - tooling

minimumReleaseAge: 0
saveExact: true
strictPeerDependencies: true

allowBuilds:
  '@swc/core': false
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@datadog/pprof': true

# Shared versions; named catalogs preserve intentional version differences.
catalog:
  '@opentelemetry/api': '1.9.1'
  '@opentelemetry/instrumentation': '0.300.0'
  '@opentelemetry/resources': '2.11.0'
  '@opentelemetry/sdk-trace-node': '2.12.0'
  '@orpc/client': '1.15.7'
  '@orpc/contract': '1.15.5'
  '@orpc/openapi': '1.15.7'
  '@orpc/openapi-client': '1.15.7'
  '@orpc/server': '1.15.7'
  '@orpc/standard-server-fastify': '1.15.7'
  '@orpc/zod': '1.15.5'
  '@storybook/react-vite': '10.6.0'
  '@tailwindcss/vite': '4.3.3'
  '@tanstack/react-form': '1.33.5'
  '@tanstack/react-query': '5.104.5'
  '@temporalio/testing': '1.24.0'
  '@types/node': '^24.0.0'
  '@types/pg': '8.23.1'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  'better-auth': '1.7.5'
  '@better-auth/passkey': '1.7.5'
  'fastify': '5.12.7'
  'fflate': '0.8.3'
  'graphql': '^16.14.2'
  'lucide-react': '1.60.0'
  'playwright': '1.64.1'
  'react': '^19.3.1'
  'react-dom': '^19.2.0'
  'storybook': '10.6.3'
  'ts-pattern': '5.9.2'
  'tsx': '^4.23.15'
  'unpdf': '1.9.1'
  'vite': '8.3.4'
  'vitest': '4.1.11'
  'zod': '4.6.7'

catalogs:
  pg-8-23-0:
    'pg': '8.23.1'
  pg-8-20-0:
    'pg': '8.20.0'
  typescript-compatible-5-9-3:
    'typescript': '~5.9.3'
  typescript-5-9-3:
    'typescript': '5.9.3'

# Keep auto-installed optional framework peers on the reviewed patch release.
overrides:
  next: 16.3.8
