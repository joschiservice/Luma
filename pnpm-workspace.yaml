packages:
  - apps/*
  - packages/*
  - packages/apps/*
  - packages/connectors/*
  - packages/simulator/*
  - tooling
  - infra

minimumReleaseAge: 0
saveExact: true
strictPeerDependencies: true

allowBuilds:
  '@swc/core': false
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@datadog/pprof': true

# Shared versions; named catalogs preserve intentional version differences.
catalog:
  '@opentelemetry/api': '1.9.1'
  '@opentelemetry/instrumentation': '0.300.0'
  '@opentelemetry/resources': '2.12.0'
  '@opentelemetry/sdk-trace-node': '2.12.0'
  '@orpc/client': '1.16.1'
  '@orpc/contract': '1.16.1'
  '@orpc/openapi': '1.16.1'
  '@orpc/openapi-client': '1.16.1'
  '@orpc/server': '1.16.1'
  '@orpc/standard-server-fastify': '1.16.1'
  '@orpc/zod': '1.16.1'
  '@storybook/react-vite': '10.6.3'
  '@tailwindcss/vite': '4.3.4'
  '@tanstack/react-form': '1.33.5'
  '@tanstack/react-query': '5.105.3'
  '@tanstack/react-router': '1.170.46'
  '@tanstack/react-router-ssr-query': '1.167.3'
  '@tanstack/react-start': '1.169.4'
  '@temporalio/testing': '1.25.0'
  '@types/node': '24.19.2'
  '@types/pg': '8.23.1'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  'better-auth': '1.7.12'
  '@better-auth/passkey': '1.7.12'
  'fastify': '5.12.8'
  'fflate': '0.8.3'
  'graphql': '17.0.2'
  'lucide-react': '1.67.0'
  'pg': '8.23.1'
  'playwright': '1.64.1'
  'react': '19.3.1'
  'react-dom': '19.3.1'
  'storybook': '10.6.5'
  'ts-pattern': '5.9.2'
  'tsx': '4.23.15'
  'unpdf': '1.9.1'
  'vite': '8.3.5'
  'vitest': '5.0.5'
  'zod': '4.6.7'

catalogs:
  # ESLint's TypeScript parser supports the compiler API through TypeScript 6.0.
  typescript-compatible-6-0-3:
    'typescript': '~6.0.3'
  # Persisted Code Step versions include this compiler version.
  typescript-5-9-3:
    'typescript': '5.9.3'

# Keep auto-installed optional framework peers on the reviewed release.
overrides:
  next: 16.4.2
  '@tanstack/react-start': 'catalog:'
