name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Package tasks each start their own workers; avoid ten tasks on two CPUs.
      TURBO_CONCURRENCY: '100%'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks and builds
            cache: builds
            command: pnpm format:check && pnpm lint && pnpm knip:check && pnpm typecheck && pnpm build
          - name: Main tests
            cache: tests
            # Forward --filter to our database runner, not pnpm's recursive test shortcut.
            command: pnpm run test --filter=!@luma/ui
          - name: UI component tests
            cache: ui
            browser: '@luma/ui'
            command: pnpm exec turbo run test --filter=@luma/ui
          - name: Simulator integration and browser
            cache: simulator
            browser: '@luma/api'
            command: pnpm test:simulator
          - name: Playbook release evaluation
            cache: evaluation
            command: pnpm test:evaluation && pnpm evaluate:playbook && pnpm evaluate:code
          - name: Backend E2E (1/2)
            cache: e2e-1
            command: pnpm test:e2e --shard=1/2
          - name: Backend E2E (2/2)
            cache: e2e-2
            command: pnpm test:e2e --shard=2/2
          - name: Browser E2E (1/4)
            cache: browser-1
            browser: '@luma/api'
            command: pnpm test:browser --shard=1/4
          - name: Browser E2E (2/4)
            cache: browser-2
            browser: '@luma/api'
            command: pnpm test:browser --shard=2/4
          - name: Browser E2E (3/4)
            cache: browser-3
            browser: '@luma/api'
            command: pnpm test:browser --shard=3/4
          - name: Browser E2E (4/4)
            cache: browser-4
            browser: '@luma/api'
            command: pnpm test:browser --shard=4/4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node24-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node24-${{ matrix.cache }}-
            turbo-${{ runner.os }}-node24-
      - if: matrix.browser
        run: pnpm --filter '${{ matrix.browser }}' exec playwright install --with-deps chromium
      - if: matrix.cache != 'builds' && matrix.cache != 'ui'
        run: pnpm setup:code
      - run: ${{ matrix.command }}
      - name: Summarize performance budgets
        if: always() && (startsWith(matrix.cache, 'browser-') || startsWith(matrix.cache, 'e2e-'))
        run: node tooling/performance/summary.mjs
      - uses: actions/upload-artifact@v4
        if: always() && (startsWith(matrix.cache, 'browser-') || startsWith(matrix.cache, 'e2e-'))
        with:
          name: performance-${{ matrix.cache }}
          path: .luma/performance/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && matrix.cache == 'evaluation'
        with:
          name: playbook-evaluation
          path: .luma/evaluations/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.cache, 'browser-')
        with:
          name: playwright-${{ matrix.cache }}
          path: .luma/playwright/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  quality:
    name: Quality gates
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
