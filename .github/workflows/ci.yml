name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Package tasks each start their own workers; avoid ten tasks on two CPUs.
      TURBO_CONCURRENCY: '100%'
      # Pull requests test what their changes affect; pushes to main run every test.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks and builds
            cache: builds
            command: pnpm format:check && pnpm lint && pnpm knip:check && pnpm typecheck && pnpm build
          - name: Main tests
            cache: tests
            # Forward --filter to our database runner, not pnpm's recursive test shortcut.
            command: pnpm run test --filter=!@luma/ui $AFFECTED
          - name: EU cell boundary tests
            cache: region-eu
            command: pnpm test:region-eu
          - name: UI component tests
            cache: ui
            browser: '@luma/ui'
            command: pnpm exec turbo run test --filter=@luma/ui
          - name: Simulator integration and browser
            cache: simulator
            browser: '@luma/api'
            command: pnpm test:simulator
          - name: Playbook release evaluation
            cache: evaluation
            # Timing scenarios share this light job so no journey shard competes with them.
            browser: '@luma/api'
            command: pnpm test:evaluation && pnpm evaluate:playbook && pnpm evaluate:code && pnpm test:performance
          - name: Backend E2E (1/2)
            cache: e2e-1
            command: pnpm test:e2e $AFFECTED --shard=1/2
          - name: Backend E2E (2/2)
            cache: e2e-2
            command: pnpm test:e2e $AFFECTED --shard=2/2
          - name: Browser E2E (1/4)
            cache: browser-1
            browser: '@luma/api'
            command: pnpm test:browser $AFFECTED --shard=1/4
          - name: Browser E2E (2/4)
            cache: browser-2
            browser: '@luma/api'
            command: pnpm test:browser $AFFECTED --shard=2/4
          - name: Browser E2E (3/4)
            cache: browser-3
            browser: '@luma/api'
            command: pnpm test:browser $AFFECTED --shard=3/4
          - name: Browser E2E (4/4)
            cache: browser-4
            browser: '@luma/api'
            command: pnpm test:browser $AFFECTED --shard=4/4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Affected selection compares against the merge base with the pull request base.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node24-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node24-${{ matrix.cache }}-
            turbo-${{ runner.os }}-node24-
      - if: matrix.browser
        run: pnpm --filter '${{ matrix.browser }}' exec playwright install --with-deps chromium
      - if: matrix.cache != 'builds' && matrix.cache != 'ui'
        run: pnpm setup:code
      - run: ${{ matrix.command }}
      - name: Summarize performance budgets
        if: always() && matrix.cache == 'evaluation'
        run: node tooling/performance/summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cache == 'evaluation'
        with:
          name: performance
          path: .luma/performance/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cache == 'evaluation'
        with:
          name: playbook-evaluation
          path: .luma/evaluations/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (startsWith(matrix.cache, 'browser-') || matrix.cache == 'evaluation')
        with:
          name: playwright-${{ matrix.cache }}
          path: .luma/playwright/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  image:
    name: Server image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Builds the deployable image without pushing it. The deploy builds for arm64; the scan
      # builds for the runner's architecture, which installs the same packages.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: luma/server:ci
          cache-from: type=gha,scope=image-scan
          cache-to: type=gha,scope=image-scan,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luma/server:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  schema-compat:
    name: Previous release on new schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_CONCURRENCY: '100%'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
      # A rollback runs the previous image on the new schema, so a pull request that adds or
      # changes migrations runs the base branch's backend journeys against them. Without
      # migration changes the job passes without setting up, so Quality gates can require it.
      - name: Detect migration changes
        id: migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --name-only "origin/$BASE_REF...HEAD" -- packages/application-runtime/migrations packages/apps | grep -qE '^packages/(application-runtime|apps/[^/]+)/migrations/[^/]+\.sql$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo 'No migration changes; the previous release is not rerun.'
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.migrations.outputs.changed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.migrations.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Checks out the base branch beside this checkout, copies this pull request's migrations
      # into it, installs it and runs its backend journeys; see tooling/dev/schema-compat.mjs.
      - if: steps.migrations.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tooling/dev/schema-compat.mjs --base "origin/$BASE_REF" --directory ../base
  quality:
    name: Quality gates
    if: always()
    needs: [checks, image, schema-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          SCHEMA_RESULT: ${{ needs.schema-compat.result }}
        run: test "$CHECKS_RESULT" = success && test "$IMAGE_RESULT" = success && test "$SCHEMA_RESULT" = success
