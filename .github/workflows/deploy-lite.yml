name: Deploy Lite cell
# Staging builds the server image for the commit, deploys it by digest and runs the smoke
# journey; production deploys only an image that staging deployed successfully, after the
# staging registry replicated it. Runs only when started by hand from `main` or a `v*` tag, and
# only for a commit whose `Quality gates` check passed. `image_tag` deploys an existing image to
# roll back. Each stage's GitHub environment holds AWS_DEPLOY_ROLE_ARN and restricts who may
# deploy; staging's LUMA_DOMAIN enables the smoke journey. See docs/deployment.md.
run-name: Deploy ${{ inputs.image_tag || github.sha }} to ${{ inputs.stage }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Existing image tag (a commit SHA) to deploy instead of this commit, for a rollback
        type: string
        required: false
permissions:
  contents: read
  checks: read
  deployments: read
  actions: read
  id-token: write
concurrency:
  group: deploy-lite-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  # The job holds the stage's environment, so GitHub records the staging deployment as
  # successful only when the deploy and the smoke journey both passed. Production promotion
  # relies on that record.
  deploy:
    name: Deploy to ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 100
    env:
      STAGE: ${{ inputs.stage }}
      TAG: ${{ inputs.image_tag || github.sha }}
      REQUESTED_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Require the release trunk and a commit that passed the quality gates
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case $REF in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "Deploys run only from main or a v* tag, not $REF"; exit 1 ;;
          esac
          # Images are tagged with the commit they were built from.
          [[ $TAG =~ ^[0-9a-f]{40}$ ]] || { echo "The image tag must be a full commit SHA"; exit 1; }
          passed=$(gh api "repos/$REPOSITORY/commits/$TAG/check-runs?check_name=Quality%20gates&filter=latest" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "Commit $TAG has no successful Quality gates check"; exit 1; }
      - name: Require a successful staging deployment of this image
        if: inputs.stage == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A deployment records the commit the workflow ran from, which differs from the image
          # in a rollback run. The run name records the image, so only a staging run named for
          # this image whose deployment reached success counts. Later deployments mark earlier
          # ones inactive, so any success status counts, not only the latest.
          verified=
          for id in $(gh api "repos/$REPOSITORY/deployments?sha=$TAG&environment=staging&per_page=100" --jq '.[].id'); do
            url=$(gh api "repos/$REPOSITORY/deployments/$id/statuses?per_page=100" \
              --jq '[.[] | select(.state == "success")][0] | .log_url // .target_url // empty')
            [[ $url =~ /actions/runs/([0-9]+) ]] || continue
            run=${BASH_REMATCH[1]}
            title=$(gh api "repos/$REPOSITORY/actions/runs/$run" --jq .display_title)
            if [ "$title" = "Deploy $TAG to staging" ]; then verified=$run; break; fi
          done
          [ -n "$verified" ] || { echo "$TAG has no successful staging deployment; deploy it to staging first"; exit 1; }
          echo "Staging run $verified deployed $TAG successfully"
      # Staging checks out the deployed commit to build it and to run its smoke journey.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.stage == 'staging'
        with:
          ref: ${{ env.TAG }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      # Tags are immutable, so a commit's image is built once and reused by later deploys. A
      # rollback deploys only an image that already exists.
      - id: image
        if: inputs.stage == 'staging'
        run: |
          if aws ecr describe-images --repository-name luma/server --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          elif [ -n "$REQUESTED_TAG" ]; then
            echo "No luma/server image is tagged $TAG"
            exit 1
          fi
      - id: registry
        if: inputs.stage == 'staging' && steps.image.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: inputs.stage == 'staging' && steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: inputs.stage == 'staging' && steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: inputs.stage == 'staging' && steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.registry.outputs.registry }}/luma/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the image digest
        id: digest
        run: |
          # Production waits up to 10 minutes for staging's registry to replicate the image.
          attempts=1
          if [ "$STAGE" = production ]; then attempts=60; fi
          digest=
          for attempt in $(seq "$attempts"); do
            if digest=$(aws ecr describe-images --repository-name luma/server --image-ids "imageTag=$TAG" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
              break
            fi
            digest=
            if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
          done
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No luma/server image is tagged $TAG in $STAGE"; exit 1; }
          echo "Deploying $TAG at $digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Run the deploy command on the host
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:luma:cell,Values=lite-$STAGE" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$instance" ] || { echo "No running Lite cell host for $STAGE"; exit 1; }
          # Both values were validated above and by the document's allowed patterns.
          command=$(aws ssm send-command --instance-ids "$instance" \
            --document-name "luma-$STAGE-deploy" --document-version "\$LATEST" --comment "Deploy $TAG" \
            --parameters "{\"imageTag\":[\"$TAG\"],\"imageDigest\":[\"$DIGEST\"]}" \
            --query Command.CommandId --output text)
          for _ in $(seq 360); do
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending | InProgress | Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          [ "$status" = Success ]
      - name: Prepare the smoke journey
        id: smoke
        if: inputs.stage == 'staging'
        env:
          DOMAIN: ${{ vars.LUMA_DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::notice::Smoke journey skipped: set the LUMA_DOMAIN variable of the staging environment."
            exit 0
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"
      # The deploy can take most of the role's one-hour session.
      - if: steps.smoke.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - if: steps.smoke.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.smoke.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.smoke.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --filter @luma/tooling
      - if: steps.smoke.outputs.run == 'true'
        run: pnpm --filter @luma/tooling exec playwright install --with-deps chromium
      - name: Run the smoke journey
        if: steps.smoke.outputs.run == 'true'
        timeout-minutes: 15
        env:
          DOMAIN: ${{ vars.LUMA_DOMAIN }}
          SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          SMOKE_BASE_URL="https://au.app.$DOMAIN" \
            SMOKE_INBOX_DOMAIN="inbox.$DOMAIN" \
            SMOKE_INBOX_BUCKET="luma-staging-smoke-inbox-$account-ap-southeast-2" \
            pnpm test:smoke
      - if: failure() && steps.smoke.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-screenshots
          path: .luma/smoke/
          if-no-files-found: ignore
          retention-days: 7
