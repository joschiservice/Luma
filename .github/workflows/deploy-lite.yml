name: Deploy Lite cell
# Builds the server image for the commit and deploys it to one stage's Lite cell. Runs only
# when started by hand; each stage's GitHub environment holds AWS_DEPLOY_ROLE_ARN and can
# require approval. See docs/deployment.md.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-lite-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 75
    env:
      STAGE: ${{ inputs.stage }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - id: registry
        uses: aws-actions/amazon-ecr-login@v2
      # Tags are immutable, so a commit's image is built once and reused by later deploys.
      - id: image
        run: |
          if aws ecr describe-images --repository-name luma/server --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.registry.outputs.registry }}/luma/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the deploy command on the host
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:luma:cell,Values=lite-$STAGE" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$instance" ] || { echo "No running Lite cell host for $STAGE"; exit 1; }
          command=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment "Deploy $TAG" \
            --parameters "commands=bash /opt/luma/bin/luma-deploy $TAG,executionTimeout=3600" \
            --query Command.CommandId --output text)
          for _ in $(seq 360); do
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending | InProgress | Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          [ "$status" = Success ]
